[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.2",
    "taskipy>=1.14.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W", "F",   # 基本
    "I",             # import
    "B",             # bugbear
    "SIM",           # simplify
    "C4",            # comprehension
    "ARG",           # unused args
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
python_version = "3.14"

# Python is used only for release-controller regression tooling.
files = ["tests"]
explicit_package_bases = true

[tool.taskipy.tasks]
check = "ruff check tests && ruff format --check tests && mypy && python tests/run_pytest.py"
fix = "ruff check --fix tests && ruff format tests"
test = "task check"


[tool.uv]
package = false
